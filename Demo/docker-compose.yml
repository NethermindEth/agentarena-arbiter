version: '3.8'

services:
  api:
    build: .
    ports:
      - "8004:8004"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - LITELLM_SERVER_URL=${LITELLM_SERVER_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_TIMEOUT_SECONDS=${LITELLM_TIMEOUT_SECONDS:-1800}
      - LITELLM_MAX_RETRIES=${LITELLM_MAX_RETRIES:-3}
      - EVALUATION_MODEL=${EVALUATION_MODEL}
      - EVALUATION_MAX_TOKENS=${EVALUATION_MAX_TOKENS:-60000}
      - EVALUATION_TEMPERATURE=${EVALUATION_TEMPERATURE:-0}
      - DEDUPLICATION_MODEL=${DEDUPLICATION_MODEL}
      - DEDUPLICATION_MAX_TOKENS=${DEDUPLICATION_MAX_TOKENS}
      - DEDUPLICATION_THINKING_LEVEL=${DEDUPLICATION_THINKING_LEVEL}
      - DEDUPLICATION_TEMPERATURE=${DEDUPLICATION_TEMPERATURE}
      - DEBUG=${DEBUG}
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge