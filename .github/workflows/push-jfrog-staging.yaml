name: Build and Push images on jfrog staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  build-arbiter-staging:
    uses: NethermindEth/github-workflows/.github/workflows/docker-build-push-jfrog.yaml@3aa8d07182110ddd5c7f3bad9d746a1db58f6f8c # v5.1.1
    with:
      repo_name: kyoto-oci-local-staging
      image_name: agentarena-arbiter
      platforms: "linux/amd64"
      context: ./Demo
      dockerfile_path: ./Demo/Dockerfile
      cache_from: type=gha,scope=agentarena-arbiter
      cache_to: type=gha,scope=agentarena-arbiter,mode=max
      push: ${{ github.event_name != 'pull_request' }}
