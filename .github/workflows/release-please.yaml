name: Release Please

on:
  workflow_call:
    outputs:
      releases_created:
        description: "Whether a release was created"
        value: ${{ jobs.release.outputs.releases_created }}
      tag_name:
        description: "The tag name of the release"
        value: ${{ jobs.release.outputs.tag_name }}
      release_name:
        description: "The name of the release"
        value: ${{ jobs.release.outputs.release_name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The action names its outputs after the release object's keys; the title is `name`.
      release_name: ${{ steps.release.outputs.name }}
    steps:
      # Release type, changelog sections and version-bumped files come from
      # release-please-config.json; the current version is tracked in
      # .release-please-manifest.json.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The action releases from the repository default branch unless told
          # otherwise; main stays the release branch whichever branch is default.
          target-branch: main
