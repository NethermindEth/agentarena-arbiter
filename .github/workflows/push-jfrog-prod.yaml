name: Build and Push images on jfrog prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes a pull request's run. Runs on main queue instead: a cancelled
# main run could already have tagged the release, and the next run would then find it
# released and skip the image push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  # Builds without pushing: prod images are only pushed from a release tag, below.
  build-arbiter-prod:
    uses: NethermindEth/github-workflows/.github/workflows/docker-build-push-jfrog.yaml@3aa8d07182110ddd5c7f3bad9d746a1db58f6f8c # v5.1.1
    with:
      repo_name: kyoto-oci-local-prod
      image_name: agentarena-arbiter
      platforms: "linux/amd64"
      context: ./Demo
      dockerfile_path: ./Demo/Dockerfile
      cache_from: type=gha,scope=agentarena-arbiter
      cache_to: type=gha,scope=agentarena-arbiter,mode=max
      push: false

  release:
    needs: [build-arbiter-prod]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    # Only this job writes to the repository; the build job above runs pull request code.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yaml

  build-and-push-prod:
    needs: [release]
    if: ${{ !failure() && needs.release.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/build-and-push-prod.yaml
    secrets: inherit
    with:
      version_tag: ${{ needs.release.outputs.tag_name }}

  create-release:
    needs: [release, build-and-push-prod]
    if: ${{ !failure() && needs.release.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/create-release.yaml
    with:
      version_tag: ${{ needs.release.outputs.tag_name }}
      release_name: ${{ needs.release.outputs.release_name }}
